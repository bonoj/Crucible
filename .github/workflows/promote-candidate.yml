name: Promote candidate
on:
  workflow_dispatch:
    inputs:
      candidate: {description: "Optional source SHA; blank promotes current preview", required: false, type: string}
permissions: {contents: write, actions: write}
concurrency: {group: crucible-promotion, cancel-in-progress: false}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Resolve candidate
        id: candidate
        env: {REQUESTED: "${{ inputs.candidate }}"}
        run: |
          if [ -n "$REQUESTED" ]; then CANDIDATE="$REQUESTED"; else CANDIDATE="$(curl --fail --silent --location https://bonoj.github.io/Crucible/PREVIEW_SOURCE_COMMIT | tr -d '[:space:]')"; fi
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
      - name: Find artifact
        id: artifact
        uses: actions/github-script@v7
        env: {CANDIDATE: "${{ steps.candidate.outputs.sha }}"}
        with:
          script: |
            const {owner,repo}=context.repo,name=`crucible-candidate-${process.env.CANDIDATE}`;
            const a=(await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,name,per_page:100})).find(x=>!x.expired&&x.name===name);
            if(!a) core.setFailed(`No live artifact ${name}`); core.setOutput("id",a.id);
      - name: Download exact candidate
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_ID: "${{ steps.artifact.outputs.id }}"}
        run: mkdir accepted && gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip && unzip -q candidate.zip -d accepted && test -s accepted/index.html
      - name: Promote exact bytes
        env: {CANDIDATE: "${{ steps.candidate.outputs.sha }}"}
        run: |
          grep -Fq "$CANDIDATE" accepted/index.html
          cp accepted/index.html index.html
          cmp --silent accepted/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote candidate $CANDIDATE"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish promoted release
        env: {GH_TOKEN: "${{ github.token }}", CANDIDATE: "${{ steps.candidate.outputs.sha }}"}
        run: gh workflow run pages.yml --ref main -f candidate="$CANDIDATE"
