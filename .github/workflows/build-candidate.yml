name: Build candidate
on:
  push:
    branches: [main]
    paths: ["src/**","tools/**","package.json",".github/workflows/build-candidate.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: crucible-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify self-contained artifact
        run: |
          test -s dist/index.html
          ! grep -E '<(script|link)[^>]+(src|href)=' dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: crucible-candidate-${{ github.sha }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
