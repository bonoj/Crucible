<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Crucible — a conversationally grown physical world."><title>Crucible</title>
<!-- CRUCIBLE:STYLE --></head>
<body><main id="world" aria-label="Crucible world. Drag to orbit; pinch or use the mouse wheel to change distance."></main>
<aside id="mark"><b>⚗️ CRUCIBLE</b></aside>
<aside id="debug-tools" aria-label="Construction controls">
  <output id="fps-counter" aria-label="Frames per second">fps …</output>
  <output id="build-id">build …</output>
  <span id="impact-buckets" aria-label="Impact magnitude">
    <button type="button" data-impact-bucket aria-label="Impact magnitude 1">1</button><button type="button" data-impact-bucket aria-label="Impact magnitude 2">2</button><button type="button" data-impact-bucket aria-label="Impact magnitude 3">3</button><button type="button" data-impact-bucket aria-label="Impact magnitude 4">4</button>
  </span>
  <button id="call-meteor" type="button" aria-label="Call meteor">☄️</button>
  <button id="spawn-bearings" type="button" aria-label="Spawn 25 thousand bearings">••</button>
  <button id="spawn-bearing-packet" type="button" data-terrain-tool="bearing-packet" aria-label="Spawn 25 bearings at tapped point">•</button>
  <button id="terrain-carve" type="button" data-terrain-tool="carve" aria-label="Carve terrain at tapped point">⛏️</button>
  <button id="terrain-raise" type="button" data-terrain-tool="raise" aria-label="Raise terrain at tapped point">🪏</button>
  <button id="transport-source" type="button" data-terrain-tool="source" aria-label="Place transport source at tapped point">💧</button>
  <button id="transport-source-thick" type="button" data-terrain-tool="source-thick" aria-label="Place thicker transport source at tapped point">🩸</button>  <button id="toggle-science" type="button" aria-label="Toggle Science mode" aria-pressed="false">🔬</button>
  <button id="transport-display-density" type="button" aria-label="Transport display density 25 of 25">🌊 25</button>
  <button id="export-locus-log" type="button" aria-label="Export locus observation log">LOG</button>
  <button id="time-scale" type="button" aria-label="Simulation speed 1 times">1×</button>
  <button id="debug-refresh" type="button" aria-label="Refresh">↻</button>
</aside>
<button id="exit-lighthugger" type="button" hidden aria-label="Return to the Terrordrome">↖ RETURN</button>
<pre id="diagnostics" role="alert" hidden></pre>
<script>globalThis.__CRUCIBLE_BUILD__="{{BUILD_COMMIT}}";</script>
<!-- CRUCIBLE:SCRIPT --></body></html>
